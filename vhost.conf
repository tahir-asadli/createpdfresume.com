
<VirtualHost *:80>
  ServerAdmin admin@resume.local
  ServerName resume.local
  ServerAlias resume.local
  DocumentRoot "/var/www/sites/resume.local/public"
  <Directory "/var/www/sites/resume.local/public">
      Options Indexes FollowSymLinks MultiViews
      AllowOverride AuthConfig FileInfo Indexes Limit Options=All,MultiViews
      Order Deny,Allow
      Allow from all
  </Directory>
  ErrorLog ${APACHE_LOG_DIR}/resume.local.log
</VirtualHost>